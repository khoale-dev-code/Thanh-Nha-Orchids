<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Sổ ghi chú khi mất mạng - Thanh Nhã</title><style>body{margin:0;background:#f5f9f6;color:#173b2a;font-family:system-ui,sans-serif;padding:20px}main{max-width:540px;margin:0 auto}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}header img{width:54px}h1{font-size:23px;margin:0}p{line-height:1.6;color:#597260}.panel{background:#fff;border:1px solid #dbeadd;border-radius:18px;padding:20px;margin:16px 0}label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}input,textarea{width:100%;box-sizing:border-box;font:inherit;border:1px solid #cadccd;border-radius:12px;padding:15px;font-size:16px}textarea{min-height:130px}button{border:0;border-radius:12px;background:#008f4b;color:white;padding:14px 18px;font-size:16px;font-weight:700;min-height:48px}button.alt{background:#e7f5ec;color:#076f42}li{margin:12px 0;padding:12px;border-bottom:1px solid #e5ede7;overflow-wrap:anywhere}small{display:block;color:#789080;margin-top:6px}.warn{background:#fff5de;padding:12px;border-radius:12px;font-size:13px}</style></head><body><main><header><img src="/icons/icon-192.png" alt="Hoa lan"/><div><h1>Sổ nháp ngoại tuyến</h1><p>Vườn Lan Thanh Nhã</p></div></header><p class="warn">Chỉ ghi tên sản phẩm, số lượng và ghi chú ngắn. Không nhập tên/số điện thoại/địa chỉ khách, thông tin ngân hàng hoặc dữ liệu nhạy cảm. Bản nháp chỉ lưu trên thiết bị, không tự chốt đơn.</p><section class="panel"><label for="title">Tên bản nháp</label><input id="title" maxlength="130" placeholder="Ví dụ: 2 chậu hồ điệp hồng"/><label for="details">Ghi chú hàng</label><textarea id="details" maxlength="1500" placeholder="Số lượng, màu hoa, kích thước..."></textarea><p id="msg" role="status"></p><button id="save">Lưu trên thiết bị</button></section><section class="panel"><h2>Bản nháp đã lưu</h2><ul id="items"></ul></section><p><button class="alt" onclick="location.href='/operations?tab=offline'">Mở lại WebApp khi có mạng</button></p></main><script>const dbName='tn-family-offline-v7',storeName='drafts';function db(){return new Promise((resolve,reject)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(storeName))r.result.createObjectStore(storeName,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function act(mode,cb){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction(storeName,mode);let result;t.oncomplete=()=>{d.close();resolve(result)};t.onerror=()=>reject(t.error);cb(t.objectStore(storeName),value=>result=value)})}async function render(){const data=await act('readonly',(s,done)=>{const r=s.getAll();r.onsuccess=()=>done(r.result)});const ul=document.getElementById('items');ul.replaceChildren();data.sort((a,b)=>b.created_at.localeCompare(a.created_at)).forEach(item=>{const li=document.createElement('li'),b=document.createElement('b'),p=document.createElement('p'),small=document.createElement('small');b.textContent=item.title;p.textContent=item.details;small.textContent=new Date(item.created_at).toLocaleString('vi-VN');li.append(b,p,small);ul.append(li)})}document.getElementById('save').onclick=async()=>{const title=document.getElementById('title').value.trim(),details=document.getElementById('details').value.trim(),msg=document.getElementById('msg');if(!title){msg.textContent='Hãy nhập tên bản nháp';return}try{const id=crypto.randomUUID();await act('readwrite',(s,done)=>{s.put({id,title,details,created_at:new Date().toISOString()});done(null)});document.getElementById('title').value='';document.getElementById('details').value='';msg.textContent='Đã lưu trên thiết bị. Không có đơn nào được gửi đi.';render()}catch(e){msg.textContent=e.message}};render().catch(()=>{document.getElementById('items').textContent='Không đọc được ghi chú trên thiết bị.'});</script></body></html>
